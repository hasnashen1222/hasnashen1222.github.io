<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
            justify-content: flex-start;
        }
        
        .image-item {
            flex: 1 1 calc(33.33% - 20px);
            min-width: 250px;
            max-width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        
        .image-container {
            margin-bottom: 15px;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .city-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        
        .country-title {
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            padding: 15px 50px;
            font-size: 1.3rem;
            text-align: center; 
            background: #fab9cd;
            outline: 0.5rem solid rgb(233, 216, 139);
            color: rgb(61, 45, 12);
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(230, 155, 233, 0.4);
        }

        img {
            border: 4px solid var(--secondary) !important;
            border-radius: 16px !important;
            background: var(--primary) !important;
        }

        .center-container .single-card img.role-img {
            max-width: 250px; 
            width: 100%;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
        }

        .center-container .single-card .role-name {
            margin-bottom: 2px;
        }

        .center-container .single-card .rarity-tag {
            font-size: 1.5rem;
            display: inline-block;
            margin-top: 0px;
        }

        .center-container .retry-btn {
            font-size: 1.2rem;
            padding: 10px 30px;
            margin-top: 25px;
            background-color: #ffffff;
            color: #7b4614;
            font-weight: bold;
            border: 3px solid #ffb6c1;
            border-radius: 8px;
            cursor: pointer;
        }

        .center-container .retry-btn:hover {
            background-color: #fff0f5;
            border-color: #ff69b4;
        }

        @media (max-width: 1200px) {
            .image-item {
                flex: 1 1 calc(50% - 20px);
            }
        }
        
        @media (max-width: 768px) {
            .image-item {
                flex: 1 1 100%;
                max-width: 400px;
            }
        }
        
        @media (max-width: 480px) {
            .images-container {
                gap: 15px;
            }
            
            .image-item {
                flex: 1 1 100%;
                min-width: 200px;
            }
            
            .image-container img {
                max-width: 300px;
            }
        }
    </style>    

</head>
<body class="theme-page result-bg">

    <div class="center-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
        <h1 class="congrats-title">-🎉 𝐂𝐨𝐧𝐠𝐫𝐚𝐭𝐮𝐥𝐚𝐭𝐢𝐨𝐧𝐬 🎉-</h1>
        
        <div class="single-card" style="text-align: center;">
            <img src="Pochacco.webp" alt="Pochacco" class="role-img">
            <h2 class="role-name">Pochacco</h2>
            <span class="rarity-tag tag-common">（ 𝑪𝒐𝒎𝒎𝒐𝒏 ）</span>
        </div>
        
        <button class="action-btn retry-btn" onclick="window.location.href='sanrio2.html'">TRY AGAIN</button>
    </div>

</body>
</html>
