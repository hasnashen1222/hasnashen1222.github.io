<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiikawa Good luck!</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
            justify-content: flex-start;
        }
        
        .image-item {
            flex: 1 1 calc(33.33% - 20px);
            min-width: 250px;
            max-width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        
        .image-container {
            margin-bottom: 15px;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .city-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        
        .country-title {
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            padding: 15px 50px;
            font-size: 1.3rem;
            text-align: center; 
            background: #fab9cd;
            outline: 0.5rem solid rgb(233, 216, 139);
            color: rgb(61, 45, 12);
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(230, 155, 233, 0.4);
        }

        img {
            border: 4px solid var(--secondary) !important;
            border-radius: 16px !important;
            background: var(--primary) !important;
        }

        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
        }

        .center-container h1 {
            margin-bottom: 25px !important;
            color: #333;
        }

        .gift-box-img {
            max-width: 280px;
            width: 85%;
            height: auto;
            margin-bottom: 25px !important;
            transition: transform 0.15s ease;
        }

        .action-btn {
            font-size: 1.2rem !important;
            padding: 12px 35px !important;
            background-color: #ffffff !important;
            color: #7b4614 !important;
            font-weight: bold;
            border: 3px solid #ffb6c1 !important; 
            border-radius: 25px !important;
            cursor: pointer;
            transition: all 0.2s ease;
        }


        .action-btn:hover {
            background-color: #fff0f5 !important;
            border-color: #ff69b4 !important;
            transform: scale(1.05);
        }

        @media (max-width: 1200px) {
            .image-item {
                flex: 1 1 calc(50% - 20px);
            }
        }
        
        @media (max-width: 768px) {
            .image-item {
                flex: 1 1 100%;
                max-width: 400px;
            }
        }
        
        @media (max-width: 480px) {
            .images-container {
                gap: 15px;
            }
            
            .image-item {
                flex: 1 1 100%;
                min-width: 200px;
            }
            
            .image-container img {
                max-width: 300px;
            }
        }
    </style>    

</head>
<body class="theme-page chiikawa-draw-bg">

    <button class="back-btn" onclick="window.location.href='Chiikawa.html'">Back</button>

    <div class="center-container">
        <h1>Wish you could get the character you want</h1>
        
        <div class="box-container" id="blindBox" onclick="startRandomDraw()">
            <img src="Gacha.webp" alt="Blind Box" class="gift-box-img">
        </div>
        
        <button class="action-btn" onclick="startRandomDraw()">Open the Gacha</button>
    </div>

    <script>
        function startRandomDraw() {
            const box = document.getElementById('blindBox');
            box.style.transform = "scale(0.95) rotate(-8deg)";

            setTimeout(() => {
                box.style.transform = "none";

                let randomNum = Math.random(); 
                let targetPage = "";

                if (randomNum <= 0.25) {
                    targetPage = 'Rakko.html'; 
                } else if (randomNum <= 0.50) {
                    targetPage = 'Kurimanju.html'; 
                } else if (randomNum <= 0.75) {
                    targetPage = 'Shisa.html'; 
                } else if (randomNum <= 0.833) {
                    targetPage = 'Usagi.html'; 
                } else if (randomNum <= 0.916) {
                    targetPage = 'Hachiware.html'; 
                } else {
                    targetPage = 'Chiikawaaa.html'; 
                }

                window.location.href = targetPage;

            }, 150);
        }
    </script>
</body>
</html>
