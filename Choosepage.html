<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Theme here</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="choose-page">

    <h1 class="main-title">Choose your favourite theme here!</h1>
    
    <div class="theme-grid">
        
        <div class="theme-card">
            <img src="Sanrio Theme image" alt="Sanrio" class="theme-img">
            <h2 class="theme-name">Sanrio</h2>
            <button class="select-btn" onclick="window.location.href='Sanrio.html'">Choose this one.</button>
        </div>

        <div class="theme-card">
            <img src="Chiikawa Theme image" alt="Chiikawa" class="theme-img">
            <h2 class="theme-name">Chiikawa</h2>
            <button class="select-btn" onclick="window.location.href='Chiikawa.html'">Choose this one.</button>
        </div>

        <div class="theme-card">
            <img src="Rilakkuma Theme image" alt="Rilakkuma" class="theme-img">
            <h2 class="theme-name">Rilakkuma</h2>
            <button class="select-btn" onclick="window.location.href='Rilakkuma.html'">Choose this one.</button>
        </div>

        <div class="theme-card">
            <img src="Pokemon Theme image" alt="Pokémon" class="theme-img">
            <h2 class="theme-name">Pokémon</h2>
            <button class="select-btn" onclick="window.location.href='Pokemon.html'">Choose this one.</button>
        </div>

    </div>

</body>
</html>
