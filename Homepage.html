<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme blind box games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pink" id="myBody">

    <div class="theme-switch">
        <span>choose your favourite theme：</span>
        <button onclick="changeTheme('pink')">🎀 Sanrio</button>
        <button onclick="changeTheme('yellow')">💙 Chiikawa </button>
    </div>

    <h1 id="pageTitle">Theme Blind Box 🎀</h1>
    
    <div class="stage">
        <p>Click the button！</p>
        
        <div class="box-container" id="blindBox" onclick="drawGacha()">🎁</div>
        
        <button class="btn" onclick="drawGacha()">Try Again！</button>
        
        <div class="result-panel" id="resultDisplay">
            <p id="defaultText">expecting your first picking</p>

            <div class="character-card" id="card-cinnamon">
                <img src="Cinnamon.webp" alt="Cinnamon">
                <p class="name">Cinnamon</p>
                <span class="rarity-tag tag-common">Normal</span>
            </div>

            <div class="character-card" id="card-pompompurin">
                <img src="pompompurin.webp" alt="Pompompurin">
                <p class="name">Pompompurin</p>
                <span class="rarity-tag tag-common">Normal</span>
            </div>

            <div class="character-card" id="card-mymelody">
                <img src="melody.webp" alt="Melody">
                <p class="name">Melody</p>
                <span class="rarity-tag tag-hidden">★Hidden style★</span>
            </div>

            <div class="character-card" id="card-kuromi">
                <img src="kuromi.webp" alt="Kuromi">
                <p class="name">Kuromi</p>
                <span class="rarity-tag tag-hidden">★Hidden style★</span>
            </div>

            <div class="character-card" id="card-usagi">
                <img src="Usagi.webp" alt="Usagi">
                <p class="name">Usagi</p>
                <span class="rarity-tag tag-common">Normal</span>
            </div> 

            <div class="character-card" id="card-hachiware">
                <img src="Hachiware.webp" alt="Hachiware">
                <p class="name">Hachiware</p>
                <span class="rarity-tag tag-common">Normal</span>
            </div>

            <div class="character-card" id="card-dorami">
                <img src="Chiikawa.webp" alt="Chiikawa">
                <p class="name">Chiikawa</p>
                <span class="rarity-tag tag-hidden">★Hidden style★</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
