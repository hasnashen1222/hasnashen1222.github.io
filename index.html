<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Theme Gacha Game</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
            justify-content: flex-start;
        }
        
        .image-item {
            flex: 1 1 calc(33.33% - 20px);
            min-width: 250px;
            max-width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        
        .image-container {
            margin-bottom: 15px;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .city-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        
        .country-title {
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            padding: 15px 50px;
            font-size: 1.3rem;
            text-align: center; 
            background: #fab9cd;
            outline: 0.5rem solid rgb(233, 216, 139);
            color: rgb(61, 45, 12);
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(230, 155, 233, 0.4);
        }

        img {
            border: 4px solid var(--secondary) !important;
            border-radius: 16px !important;
            background: var(--primary) !important;
        }

        .theme-img {
            width: 220px;
            height: 160px;
            margin-bottom: 15px;
        }

        .select-btn {
            font-size: 1rem;
            padding: 8px 20px;
            background-color: #ffffff;
            color: #7b4614;
            font-weight: bold;
            border: 2px solid #ffb6c1;
            border-radius: 20px;
            cursor: pointer;
        }

        .select-btn:hover {
            background-color: #fff0f5;
            border-color: #ff69b4;
        }
    </style>    

</head>
<body class="choose-page">

    <h1 class="main-title" style="text-align: center; margin-top: 30px; margin-bottom: 30px;"> ✭ 𝐖𝐞𝐥𝐜𝐨𝐦𝐞 𝐭𝐨 𝐓𝐡𝐞𝐦𝐞 𝐆𝐚𝐜𝐡𝐚 𝐆𝐚𝐦𝐞 ✭</h1>
    <h2 class="main-title" style="text-align: center; margin-top: 30px; margin-bottom: 30px;">𝑃𝑙𝑒𝑎𝑠𝑒 𝑐ℎ𝑜𝑜𝑠𝑒 𝑦𝑜𝑢𝑟 𝑓𝑎𝑣𝑜𝑟𝑖𝑡𝑒 𝑡ℎ𝑒𝑚𝑒 ℎ𝑒𝑟𝑒!</h2>
    
    <div class="theme-grid" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 30px;">
        
        <div class="theme-card" style="text-align: center;">
            <img src="Sanrio.webp" alt="Sanrio" class="theme-img">
            <h2 class="theme-name">Sanrio</h2>
            <button class="select-btn" onclick="window.location.href='Sanrio.html'">Choose this one.</button>
        </div>

        <div class="theme-card" style="text-align: center;">
            <img src="Chiikawa.webp" alt="Chiikawa" class="theme-img">
            <h2 class="theme-name">Chiikawa</h2>
            <button class="select-btn" onclick="window.location.href='Chiikawa.html'">Choose this one.</button>
        </div>

    </div>

</body>
</html>
